<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de la OCA</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="container">

        <div class="panel-control">

            <h2>Turno: <span id="indicador-turno">J1</span></h2>

            <button id="btn-dado">Tirar Dado</button>

            <div id="resultado-dado" class="dado">-</div>

            <!-- Botón de Nueva Partida -->
            <button id="btn-reiniciar">Nueva Partida</button>

        </div>

        <div id="tablero" class="tablero">

            <img src="assets/tablero.png" alt="Tablero del juego">

            <div id="ficha1" class="ficha1">
                <span>J1</span>
            </div>

            <div id="ficha2" class="ficha2">
                <span>J2</span>
            </div>

        </div>

    </div>

    <script src="index.js"></script>

</body>
</html>
